name: Security checks

# Builds a throwaway database from the repo's migrations on the runner, seeds the test
# personas and runs the access-rule checks against it. It never connects to staging or
# production and uses no repository secrets: the local stack generates its own keys. See
# docs/design/security-test-suite.md.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.67.1

jobs:
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Runs on every pull request so it can be made a required check, but only does the
      # work when database-related files changed.
      - name: Check for database changes
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(supabase/|scripts/db/|scripts/test-accounts/|packages/domain/testing/|\.github/workflows/security\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No database-related changes; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changes.outputs.run == 'true'
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - if: steps.changes.outputs.run == 'true'
        name: Install dependencies
        run: npm ci

      - if: steps.changes.outputs.run == 'true'
        name: Start a local database from the migrations
        run: scripts/db/start-local.sh

      - if: steps.changes.outputs.run == 'true'
        name: Seed personas and run the access-rule checks
        run: scripts/db/security-checks.sh
